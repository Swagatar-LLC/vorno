# VORNO trigger server — nginx reverse proxy snippet.
#
# SSE and WebSocket each need explicit handling in nginx:
#   - SSE   (/api/sessions/{id}/events): proxy_buffering off + long read timeout,
#           HTTP/1.1, no Connection: keep-alive rewriting that breaks the stream.
#   - WS    (/ws): the Upgrade/Connection: upgrade header dance.
#
# Drop this inside an `http { }` context (the map) + a `server { }` for your TLS
# vhost. Terminate TLS here; apps/server has no built-in TLS by design.

# Map the Upgrade header so WebSocket upgrades pass through correctly.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl;
	http2 on;
	server_name vorno.example.com;

	# ssl_certificate     /etc/letsencrypt/live/vorno.example.com/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/vorno.example.com/privkey.pem;

	# --- WebSocket transport (/ws, /rpc) ---
	location ~ ^/(ws|rpc)$ {
		proxy_pass http://127.0.0.1:3847;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	# --- SSE event stream (long-lived, must not be buffered) ---
	location ~ ^/api/sessions/[^/]+/events$ {
		proxy_pass http://127.0.0.1:3847;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Connection '';
		proxy_buffering off;
		proxy_cache off;
		chunked_transfer_encoding off;
		proxy_read_timeout 3600s;
	}

	# --- Everything else (REST) ---
	location / {
		proxy_pass http://127.0.0.1:3847;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Optional: restrict the unauthenticated /health probe.
		# location = /health { allow 100.64.0.0/10; deny all; proxy_pass http://127.0.0.1:3847; }
	}
}
