name: Release

# Tag-triggered release pipeline (PLAN-019 / ADR-0009).
#
# Push a `v*` tag (e.g. `v0.11.0`, matching apps/electron/package.json `version`)
# to build the macOS arm64 Vorno app. When the Apple signing secrets are present
# the build is signed + notarized + stapled and published to the public
# Swagatar-LLC/vorno-releases feed (electron-updater's github provider consumes
# Vorno-arm64.zip + latest-mac.yml from there). Until the cert lands the build
# runs ad-hoc for inspection and NO publish happens — an ad-hoc artifact must
# never reach the feed.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-macos:
    name: Build & release (macOS arm64)
    # macos-14 is Apple Silicon — required for a native arm64 build.
    runs-on: macos-14
    outputs:
      # Consumed by publish-docs: documentation is only published for a release
      # that actually reached the feed.
      has_signing: ${{ steps.gate.outputs.has_signing }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      # ---------------------------------------------------------------------
      # Gate: verify the pushed tag matches the electron app version, and
      # decide whether the signing path is fully configured. All five Apple
      # secrets must be present to sign+notarize+publish; any absent → ad-hoc
      # verification build with no publish.
      # ---------------------------------------------------------------------
      - name: Compute release gate
        id: gate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION="$(node -p "require('./apps/electron/package.json').version")"
          echo "Pushed tag: ${TAG} | electron app version: ${APP_VERSION}"
          if [ "${TAG}" != "v${APP_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match electron app version v${APP_VERSION}. Bump apps/electron/package.json and re-tag."
            exit 1
          fi
          # LEARNING-025: the DISPLAYED version (Settings About, update toasts,
          # Sentry release) compiles in packages/shared/package.json — a partial
          # bump ships a build that lies about its own version. Enforce the
          # cluster bump (scripts/bump-version.ts) here.
          SHARED_VERSION="$(node -p "require('./packages/shared/package.json').version")"
          if [ "${SHARED_VERSION}" != "${APP_VERSION}" ]; then
            echo "::error::packages/shared version ${SHARED_VERSION} != electron version ${APP_VERSION}. Run: bun scripts/bump-version.ts ${APP_VERSION}"
            exit 1
          fi
          if [ -n "${CSC_LINK}" ] && [ -n "${CSC_KEY_PASSWORD}" ] && [ -n "${APPLE_ID}" ] \
             && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present → signed+notarized build WILL publish to vorno-releases."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets absent → AD-HOC verification build. Publish is SKIPPED; no artifact reaches the vorno-releases feed."
          fi

      # ---------------------------------------------------------------------
      # Pre-create the release tag AND the release itself in the feed repo
      # (LEARNING-023). electron-builder's GitHub publisher runs one task per
      # artifact and each lazily does find-or-create on the release — the
      # parallel creates race:
      #   - tag absent  → 422 "Published releases must have a valid tag"
      #     (killed v0.11.2 + v0.11.3 attempt 1)
      #   - tag present → one create wins, siblings 422 "already_exists" on
      #     tag_name and the build still fails (killed v0.11.4 attempt 1)
      # In every incident the re-run succeeded because the release already
      # existed — so make that the guaranteed state: create tag + published
      # release up front; electron-builder then only ever finds-and-uploads.
      # Name matches electron-builder's convention (version without the "v").
      # Idempotent: existing tag/release are left untouched.
      # ---------------------------------------------------------------------
      - name: Ensure release tag + release exist in feed repo
        if: steps.gate.outputs.has_signing == 'true'
        env:
          GH_TOKEN: ${{ secrets.VORNO_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          FEED="Swagatar-LLC/vorno-releases"
          if gh api "repos/${FEED}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists in ${FEED}"
          else
            HEAD_SHA="$(gh api "repos/${FEED}/commits/HEAD" --jq .sha)"
            gh api "repos/${FEED}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${HEAD_SHA}"
            echo "Created tag ${TAG} -> ${HEAD_SHA} in ${FEED}"
          fi
          if gh api "repos/${FEED}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release for ${TAG} already exists in ${FEED}"
          else
            gh release create "${TAG}" --repo "${FEED}" --title "${VERSION}" \
              --notes "Vorno ${VERSION} — assets uploading. See https://github.com/Swagatar-LLC/vorno for the changelog."
            echo "Created release ${VERSION} (${TAG}) in ${FEED}"
          fi

      # ---------------------------------------------------------------------
      # Build. build-dmg.sh reads APPLE_* / CSC_* from the environment (the
      # 1Password sync path no-ops in CI — `op` is not installed — and there is
      # no .env). EB_PUBLISH gates electron-builder's own publish step: `always`
      # only when signing is configured (single atomic electron-updater flow —
      # generates + uploads Vorno-arm64.zip, latest-mac.yml and .dmg with
      # blockmaps in the exact format Squirrel.Mac expects), else `never`.
      # ---------------------------------------------------------------------
      - name: Build Vorno (arm64)
        env:
          # Authenticates @vscode/ripgrep's postinstall download (shared runner
          # IP hits GitHub's unauthenticated 60/hr limit otherwise). Only has
          # access to this (source) repo — NOT the vorno-releases feed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing + notarization (deferred until the cert lands).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Publish target. electron-builder's github publisher prefers GH_TOKEN
          # over GITHUB_TOKEN, so publishing goes to vorno-releases (fine-grained
          # PAT, contents:write on that repo only). Empty when signing is off,
          # which is harmless because EB_PUBLISH is then `never`.
          GH_TOKEN: ${{ secrets.VORNO_RELEASES_TOKEN }}
          EB_PUBLISH: ${{ steps.gate.outputs.has_signing == 'true' && 'always' || 'never' }}
        run: bash apps/electron/scripts/build-dmg.sh arm64

      # ---------------------------------------------------------------------
      # Verify the expected artifacts exist. The DMG (manual installs) and ZIP
      # (Squirrel.Mac auto-update) are always produced. latest-mac.yml is the
      # auto-update manifest electron-updater reads — required whenever we
      # publish; fail the job if it is missing.
      # ---------------------------------------------------------------------
      - name: Verify artifacts
        run: |
          set -euo pipefail
          REL="apps/electron/release"
          echo "Contents of ${REL}:"
          ls -la "${REL}"
          test -f "${REL}/Vorno-arm64.dmg" || { echo "::error::Vorno-arm64.dmg not found"; exit 1; }
          test -f "${REL}/Vorno-arm64.zip" || { echo "::error::Vorno-arm64.zip not found (Squirrel.Mac auto-update needs it)"; exit 1; }
          if [ "${{ steps.gate.outputs.has_signing }}" = "true" ]; then
            test -f "${REL}/latest-mac.yml" || { echo "::error::latest-mac.yml not found — electron-updater cannot serve updates"; exit 1; }
            echo "Signed release published to Swagatar-LLC/vorno-releases (tag ${GITHUB_REF_NAME})."
          fi

      # ---------------------------------------------------------------------
      # Ad-hoc path only: nothing was published, so surface the DMG + ZIP as a
      # workflow artifact for manual inspection.
      # ---------------------------------------------------------------------
      - name: Upload ad-hoc build for inspection
        if: steps.gate.outputs.has_signing != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vorno-arm64-adhoc
          path: |
            apps/electron/release/Vorno-arm64.dmg
            apps/electron/release/Vorno-arm64.zip
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Publish the documentation and changelog for this release (PLAN-034 Lane C,
  # ADR-0023).
  #
  # ADR-0023 made documentation a release artifact: DOCS_URL points at
  # vorno.ai/docs, so if the site is not rebuilt at the tag, a shipped build
  # links users and agents at stale or missing pages. That is a user-visible
  # failure with no build failure — the LEARNING-048 shape.
  #
  # It has already happened once. v0.17.0 shipped green while vorno.ai stayed
  # on the previous build: /changelog/0.17.0/ and eighteen new service guides
  # 404'd, and only an explicit manual check caught it. Nothing here is
  # theoretical.
  #
  # Gated on has_signing because an ad-hoc build publishes nothing to the feed.
  # Publishing docs for a version with no release would also break the site
  # build outright, which cross-checks its rendered version pages against the
  # release feed and fails on a mismatch.
  # -----------------------------------------------------------------------
  publish-docs:
    name: Publish docs + changelog (vorno.ai)
    needs: release-macos
    if: needs.release-macos.outputs.has_signing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to Swagatar-LLC/vorno-site
        id: dispatch
        env:
          # Fine-grained PAT with Contents: read and write on
          # Swagatar-LLC/vorno-site — the permission the repository-dispatch
          # API requires. The built-in GITHUB_TOKEN cannot reach another repo.
          GH_TOKEN: ${{ secrets.VORNO_SITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VORNO_SITE_DISPATCH_TOKEN is not set — docs and changelog were NOT published for ${TAG}. Publish by hand, or run the 'Publish docs + changelog' workflow in Swagatar-LLC/vorno-site with tag=${TAG}."
            exit 0
          fi
          jq -n --arg tag "${TAG}" \
            '{event_type: "vorno-release", client_payload: {tag: $tag}}' \
            | gh api repos/Swagatar-LLC/vorno-site/dispatches --input -
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "Dispatched vorno-release (${TAG}) to Swagatar-LLC/vorno-site."

      # ---------------------------------------------------------------------
      # Confirm the docs actually went live.
      #
      # The dispatch API returns 204 as soon as the event is queued — it says
      # nothing about whether the site built or deployed. Without this step a
      # green release would still not mean published documentation, which is
      # the exact gap this job exists to close. The site workflow verifies
      # itself too; this is the independent check on the release side, and it
      # is what makes "release is green" honest.
      #
      # Polls rather than asserting once: the site has to build and deploy
      # first, and freshly uploaded Workers assets propagate across PoPs
      # asynchronously.
      # ---------------------------------------------------------------------
      - name: Verify docs + changelog are live
        if: steps.dispatch.outputs.dispatched == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          DEADLINE=$(( SECONDS + 900 ))   # 15 minutes
          PATHS="/docs/ /changelog/${VERSION}/"
          echo "Waiting for vorno.ai to publish ${TAG} (up to 15 min)..."
          while :; do
            ALL_OK=1
            for p in ${PATHS}; do
              CODE=$(curl -sL -o /dev/null -w '%{http_code}' "https://vorno.ai${p}" || echo 000)
              echo "  ${p} -> ${CODE}"
              [ "${CODE}" = "200" ] || ALL_OK=0
            done
            if [ "${ALL_OK}" = "1" ]; then
              echo "Documentation for ${TAG} is live."
              exit 0
            fi
            if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
              echo "::error::The app release for ${TAG} succeeded and is published, but the documentation site did NOT update within 15 minutes. Check the 'Publish docs + changelog' run in Swagatar-LLC/vorno-site. DOCS_URL now points at stale pages."
              exit 1
            fi
            sleep 30
          done

      - name: Summary
        if: always()
        env:
          TAG: ${{ github.ref_name }}
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched }}
        run: |
          {
            echo "## Documentation for ${TAG}"
            echo
            if [ "${DISPATCHED}" = "true" ]; then
              echo "Dispatched to \`Swagatar-LLC/vorno-site\` and verified live."
              echo
              echo "- <https://vorno.ai/docs/>"
              echo "- <https://vorno.ai/changelog/${TAG#v}/>"
            else
              echo "**Not published** — \`VORNO_SITE_DISPATCH_TOKEN\` is not set on this repository."
              echo
              echo "The app release itself is unaffected. To publish the docs, run the"
              echo "**Publish docs + changelog** workflow in \`Swagatar-LLC/vorno-site\` with"
              echo "\`tag=${TAG}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
