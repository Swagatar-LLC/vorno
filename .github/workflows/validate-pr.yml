name: Validate PR

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-pr-${{ github.ref }}
  cancel-in-progress: true

# @vscode/ripgrep's postinstall downloads the `rg` binary from api.github.com.
# Unauthenticated requests share the runner's public IP and hit GitHub's 60/hr
# rate limit → intermittent `Download failed with 403` during bun install.
# Exposing the auto-provided GITHUB_TOKEN authenticates the download (1000/hr
# per-repo). vscode-ripgrep's download.js reads this env var directly.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Typecheck — all packages that pass (excludes apps/electron — broken upstream)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile

      - name: Typecheck packages/core
        run: cd packages/core && bunx tsc --noEmit

      - name: Typecheck packages/shared
        run: cd packages/shared && bunx tsc --noEmit

      - name: Typecheck packages/server-core
        run: cd packages/server-core && bunx tsc --noEmit

      - name: Typecheck packages/server
        run: cd packages/server && bunx tsc --noEmit

      - name: Typecheck packages/session-tools-core
        run: cd packages/session-tools-core && bunx tsc --noEmit

      - name: Typecheck packages/ui
        run: cd packages/ui && bunx tsc --noEmit

      - name: Typecheck apps/server (HTTP trigger)
        run: cd apps/server && bunx tsc --noEmit 2>&1 | grep -v "TS6059" || true
        # TS6059 = test files outside rootDir (pre-existing, harmless)

  # ---------------------------------------------------------------------------
  # Unit + integration tests — shared packages
  # ---------------------------------------------------------------------------
  test-shared:
    name: Test shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile

      - name: Run shared tests
        # The suite is expected to be fully green. The former allowance (up to 20
        # failures) masked 14 real ones that were env-dependent, not flaky:
        #   - 11 needed an already-populated config dir, so they passed on a dev
        #     machine and failed on a fresh runner. Fixed by the throwaway
        #     CRAFT_CONFIG_DIR fixture in packages/shared/tests/setup/.
        #   - 3 asserted Windows path semantics but gated on isPowerShellAvailable(),
        #     which is true on this runner (ubuntu ships pwsh). Now skipIf(!win32).
        # Keep this at zero — a nonzero count is a real regression, not noise.
        run: |
          cd packages/shared
          bun test 2>&1 | tee /tmp/shared-results.txt || true
          # Bun summary is in the last 5 lines: " N pass", " N fail", "Ran N tests..."
          # Strip ANSI codes and extract from summary only
          SUMMARY=$(tail -5 /tmp/shared-results.txt | tr -d '\033' | sed 's/\[[0-9;]*m//g')
          PASS_COUNT=$(echo "$SUMMARY" | grep -Eo '[0-9]+ pass' | grep -Eo '[0-9]+' || echo "0")
          FAIL_COUNT=$(echo "$SUMMARY" | grep -Eo '[0-9]+ fail' | grep -Eo '[0-9]+' || echo "0")
          echo "Shared tests: $PASS_COUNT pass, $FAIL_COUNT fail"
          if [ "$PASS_COUNT" -lt 3300 ]; then
            echo "::error::Shared test pass count dropped below 3300 (got $PASS_COUNT). Regression detected."
            exit 1
          fi
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::Shared tests must be green (got $FAIL_COUNT failures)."
            exit 1
          fi
          echo "✓ Shared tests healthy"

  # ---------------------------------------------------------------------------
  # Unit + integration tests — HTTP trigger server (strict: 0 failures)
  # ---------------------------------------------------------------------------
  test-server:
    name: Test HTTP trigger server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile

      - name: Run server tests (strict — 0 failures allowed)
        run: cd apps/server && bun test

  # ---------------------------------------------------------------------------
  # WebUI tests — headless smoke suite (real HTTP host + login + WS proxy) plus
  # the fork-owned main-process webui unit suites, the webui adapter tests,
  # the electron app-shell renderer suites, packages/ui (all annotation/
  # follow-up logic lives there), and packages/server-core (transport client).
  # These were previously un-gated (local-only); strict — 0 failures allowed.
  # ---------------------------------------------------------------------------
  test-webui:
    name: Test WebUI (headless smoke + units)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile

      - name: Run WebUI tests (strict — 0 failures allowed)
        run: bun run test:webui

  # ---------------------------------------------------------------------------
  # Doc tools — Python smoke tests for document conversion utilities
  # ---------------------------------------------------------------------------
  test-doc-tools:
    name: Test doc tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile

      - name: Run doc-tools smoke tests
        run: bun run test:doc-tools

  # ---------------------------------------------------------------------------
  # Share Worker — the vorno-share backend behind VIEWER_URL (ADR-0024).
  # Its own job because nothing else runs tests under apps/, and an untested
  # auth path on a public write endpoint is the last place to accept that.
  # ---------------------------------------------------------------------------
  test-share-worker:
    name: Test share Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # No `bun install` needed: the Worker imports only Web platform globals.

      - name: Run share Worker tests (strict — 0 failures allowed)
        run: cd apps/viewer && bun test worker/

  # ---------------------------------------------------------------------------
  # i18n gates — locale parity, alphabetical sort, and t()/Trans coverage
  # ---------------------------------------------------------------------------
  i18n:
    name: i18n gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile

      - name: Locale parity (en.json ↔ all other locales)
        run: bun run lint:i18n:parity

      - name: Locale alphabetical sort
        run: bun run lint:i18n:sorted

      - name: Coverage (every literal t() / i18n.t() / <Trans i18nKey> resolves)
        run: bun run lint:i18n:coverage

  # ---------------------------------------------------------------------------
  # Branding gate — no brand strings / upstream endpoints outside branding.ts
  # (VOR-3; allowlist: scripts/branding-allowlist.json, doc: docs/branding-inventory.md)
  # ---------------------------------------------------------------------------
  branding:
    name: Branding gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # No `bun install` needed: check-branding.ts imports only node built-ins
      # (fs/path), so the gate runs dependency-free and fast.

      - name: Check brand/endpoint strings route through branding module
        run: bun run scripts/check-branding.ts

  # ---------------------------------------------------------------------------
  # Headroom boundary gate — the Headroom SDK may be imported by exactly one
  # file (PLAN-040 / SUV-0015). The integration's whole long-term-support story
  # is that an SDK upgrade, a swap to the proxy/MCP surface, or dropping Headroom
  # is a change to that one file; a single stray import next quarter silently
  # ends that, and review does not reliably catch one added import line.
  # ---------------------------------------------------------------------------
  headroom-boundary:
    name: Headroom boundary gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # No `bun install` needed: check-headroom-boundary.ts imports only node
      # built-ins (fs/path), so the gate runs dependency-free and fast — the same
      # arrangement as the branding gate above.

      - name: Check the Headroom SDK is imported only by the boundary module
        run: bun run scripts/check-headroom-boundary.ts

  # ---------------------------------------------------------------------------
  # Build check — verify entry points resolve
  # ---------------------------------------------------------------------------
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile

      - name: Build apps/server (HTTP trigger)
        run: |
          bun build apps/server/src/index.ts --target=bun --outdir=/tmp/build-check --no-splitting 2>&1 | tail -5
          echo "✓ apps/server bundle built successfully"
